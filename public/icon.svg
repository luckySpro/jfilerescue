<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1a3a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- disk platter (bottom-left) -->
  <g opacity="0.22">
    <ellipse cx="256" cy="400" rx="190" ry="48" fill="#fff"/>
    <ellipse cx="256" cy="384" rx="190" ry="48" fill="#fff"/>
  </g>
  <!-- document sheet -->
  <g filter="url(#sh)">
    <path d="M168 112 h130 l78 78 v200 a24 24 0 0 1 -24 24 H168 a24 24 0 0 1 -24 -24 V136 a24 24 0 0 1 24 -24 z" fill="url(#sheet)"/>
    <path d="M298 112 v54 a24 24 0 0 0 24 24 h54 z" fill="#c7d2fe"/>
  </g>
  <!-- text lines -->
  <g fill="#94a3b8" opacity="0.9">
    <rect x="184" y="214" width="110" height="12" rx="6"/>
    <rect x="184" y="246" width="160" height="12" rx="6"/>
    <rect x="184" y="278" width="130" height="12" rx="6"/>
  </g>
  <!-- rescue ring / recovery arrow (bottom-right) -->
  <g transform="translate(330 330)">
    <circle r="86" fill="#0f172a" opacity="0.28"/>
    <circle r="78" fill="url(#ring)"/>
    <path d="M-30 6 a34 34 0 1 1 10 24" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M-44 -4 l16 22 l20 -18 z" fill="#ffffff"/>
  </g>
</svg>
